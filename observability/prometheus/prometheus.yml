global:
  scrape_interval: 15s

scrape_configs:
  - job_name: apigateway
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["apigateway:8080"]

  - job_name: authservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["authservice:8083"]

  - job_name: userservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["userservice:8081"]

  - job_name: postservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["postservice:8082"]

  - job_name: notificationservice
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["notificationservice:8084"]
