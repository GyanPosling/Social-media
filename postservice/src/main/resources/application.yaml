spring:
  application:
    name: postservice
  datasource:
    url: jdbc:postgresql://localhost:5432/social_media
    username: social
    password: social
  data:
    redis:
      host: localhost
      port: 6379
  flyway:
    enabled: true
    table: flyway_schema_history_post
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

gateway:
  internal-signing-secret: ${GATEWAY_INTERNAL_SIGNING_SECRET:change-this-internal-secret-to-at-least-32-characters}
  signature-max-age-seconds: 300

server:
  port: 8082

management:
  tracing:
    sampling:
      probability: ${TRACING_SAMPLING_PROBABILITY:1.0}
  otlp:
    tracing:
      endpoint: ${OTEL_EXPORTER_OTLP_ENDPOINT:http://localhost:4318/v1/traces}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
